<div id="filterChildren" class="btn-bar">
  <button class="btn-bar filterBtn active" data-filter="all">All Molecules</button>
  {% for opt in categories %}
    <button class="btn filterBtn" data-filter="{{ opt }}">{{ opt }}</button>
  {% endfor %}
</div>

<div id="model3d_container" class="viewer-hidden">
  <div id="model3d"></div>
</div>

<div class="all-pngs">
  {% for i in items %}
    <img class="filterBtn {{ i.category }}"
         src="{{ i.filename }}"
         alt="{{ i.label }}"
         title="{{ i.label }}"
         data-smiles="{{ i.label | e }}"
         data-pdb="{{ i.pdb_url }}">
  {% endfor %}
</div>
{% endblock %}
